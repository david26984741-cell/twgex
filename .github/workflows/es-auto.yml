name: ES 曝險地圖（自動，跑在紅線）

# ── 為什麼要拆成兩個 job ────────────────────────────────────────────────
# CME 的邊緣節點（Akamai）擋掉 GitHub 自家 runner 的 IP，所以「抓 CME」只能在
# 自己的機器上做。但那台機器**沒有裝 git**，提交推送做不了。
# 剛好兩邊的短處互補，所以：
#   job fetch （紅線）  ：只做一件它獨佔的事——跟 CME 講話，順便把圖算出來
#   job commit（GitHub）：把結果接過來提交推送
# 這樣紅線那台只跑必要的部分，其他都留在 GitHub 的機器上。
#
# ── 紅線那台的兩個限制（2026/09/01 實測，繞過去了，不用動那台任何設定）──
# 1. PowerShell 執行原則是 Restricted，workflow 裡任何 .ps1 一律被擋
#    （連 actions/setup-python 都不行，它內部要跑 setup.ps1）→ 全部用 cmd。
# 2. 沒有裝 Python → 用 Windows 內建的 curl.exe ＋ tar.exe 抓一份免安裝的
#    embeddable Python。本專案除了 cme_fetch.py 用到 playwright 之外全是標準
#    函式庫，所以夠用。不用安裝、不用管理員權限、不碰安全設定。
#
# 對外要走公司的 Proxy（proxy.capital.com.tw:8080），已經寫在 runner 的 .env，
# curl 與 Python 的 urllib 都會自己讀 https_proxy。
on:
  schedule:
    # 【紅線的外網只在台北 14:00 ~ 隔天 06:00 開放】06:00~14:00 公司封外網。
    # 這不是可以繞的東西，排程必須整個避開那段。
    #
    # 實測證據（2026/09/04~08）：三次在封網時段起跑的執行（13:13、13:26、13:34）
    # 全部在 14:04~14:05 結束——不是跑了 30~50 分鐘，是卡在那邊空轉等到 14:00
    # 開網才在五分鐘內跑完。完全落在開放時段的執行都只要 4~5 分鐘。
    # 舊的台北 09:00 那班（cron 0 1）永遠落在封網中，結構上不可能成功，已移除。
    #
    # 兩班都留大量餘裕：GitHub 排程常延遲一到三小時，
    # 15:15 延遲四小時是 19:15、21:00 延遲四小時是隔天 01:00，都還在開放時段內，
    # 離 06:00 封網還有好幾個小時。
    #
    # ── 台北 15:15（週二~週六）＝美東 03:15，CME 前一場次的結算早就發布了
    - cron: '15 7 * * 2-6'
    # ── 台北 21:00（週二~週六）＝美東 09:00，當天的第二次機會
    - cron: '0 13 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gexmap-daily          # 跟每日更新同一組，不會同時寫 data/
  cancel-in-progress: false

env:
  PYVER: 3.12.7

jobs:
  fetch:
    name: 抓 CME 並建圖（紅線）
    runs-on: [self-hosted, cme]
    defaults:
      run:
        # /V:ON＝開延遲環境變數展開，重試迴圈裡的 !RC! 才會每一輪重新取值
        # （用 %RC% 的話整個 for 區塊在進入前就被展開成同一個值，迴圈等於失效）
        shell: cmd /V:ON /C call {0}
    steps:
      - uses: actions/checkout@v4

      - name: 弄一份可攜式 Python
        run: |
          echo === proxy：%https_proxy%
          if not exist pyemb.zip curl.exe -sSL --retry 2 -o pyemb.zip https://www.python.org/ftp/python/%PYVER%/python-%PYVER%-embed-amd64.zip
          if not exist pyemb.zip ( echo 下載 Python 失敗 & exit /b 1 )
          if exist pyemb rmdir /s /q pyemb
          mkdir pyemb
          tar -xf pyemb.zip -C pyemb
          rem embeddable 版的 sys.path 由 ._pth 寫死，要自己把專案目錄加進去，
          rem 不然 build.py 找不到 engine / symbols / cme 這些同目錄模組。
          echo %CD%>> pyemb\python312._pth
          pyemb\python.exe -c "import sys; print(sys.version); print(sys.path)"

      - name: 不變量自我測試
        run: pyemb\python.exe -X utf8 selftest.py

      # build.py 的訊息一律抄一份進 workflow 摘要。
      # 失敗時 Actions 的 log 介面常常展不開那一步（實測過），
      # 摘要則一定看得到，而且會留在 run 頁面上。
      # 最多跑三輪。掉系列是這條線路最常見的失敗方式（公司 proxy 不穩），
      # 而且是「這一輪的運氣」，重跑一次通常就好——2026/09/05~07 連三天失敗、
      # 09/08 同樣的程式碼一次就過，就是這個性質。
      # 沒有重試的話，一次網路抖動就整天沒有 ES 的圖。
      # 成功的一輪約 30~40 分鐘，三輪的上限由 timeout-minutes 兜著。
      - name: 抓 CME 並建 ES 的圖（最多重試三次）
        timeout-minutes: 150
        run: |
          set PYTHONIOENCODING=utf-8
          set RC=1
          for %%N in (1 2 3) do (
            if !RC! NEQ 0 (
              echo ===== 第 %%N 輪 =====
              rem 【2026/09/08 試過用 curl 先探 CME 通不通，撤掉了】
              rem 探測一律回 HTTP 000（連線直接失敗），但同一時間 build.py 抓得好好的。
              rem 原因是 Akamai 看 User-Agent：curl 預設的 `curl/8.x` 會被直接重置連線，
              rem 而 cme.py 帶的是四段版本號的 Chrome UA（見 cme.py 的 UA 常數）。
              rem 也就是說那個探測是假警報，還把整條線擋死。要重做的話 UA 必須一致，
              rem 而且要先實測過再放進來——排程避開封網時段才是真正的解法。
              pyemb\python.exe -X utf8 build.py --symbol ES > build_out.txt 2>&1
              set RC=!ERRORLEVEL!
              echo ### 第 %%N 輪 build.py 的輸出（離開碼 !RC!^) >> %GITHUB_STEP_SUMMARY%
              echo. >> %GITHUB_STEP_SUMMARY%
              echo ``` >> %GITHUB_STEP_SUMMARY%
              type build_out.txt >> %GITHUB_STEP_SUMMARY%
              echo ``` >> %GITHUB_STEP_SUMMARY%
              type build_out.txt
              if !RC! NEQ 0 (
                echo 這一輪沒過，等 120 秒再試。
                ping -n 121 127.0.0.1 > nul
              )
            )
          )
          exit /b !RC!

      - name: 把結果交出去
        uses: actions/upload-artifact@v4
        with:
          name: es-data
          path: data/ES/
          retention-days: 3
          if-no-files-found: error

  commit:
    name: 提交（GitHub 的機器）
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 推送被拒時要能 rebase

      - uses: actions/download-artifact@v4
        with:
          name: es-data
          path: data/ES/

      - name: 檢查接到的東西
        run: |
          python - <<'PY'
          import json
          m = json.load(open("data/ES/latest.json", encoding="utf-8"))["meta"]
          print(f"trade_date={m['trade_date']}  未平倉={m.get('oi_total'):,}  "
                f"標的價={m.get('s_ref')}  來源={m.get('source')}")
          assert m.get("oi_total", 0) > 0, "未平倉是 0，不提交"
          PY

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 一定要先 add 再比對：git diff 看不到「未追蹤」的新檔。
          git add -A data/ES/
          if git diff --cached --quiet -- data/ES/; then
            echo "ES 資料沒有變動（可能是重複跑同一天），跳過提交。"
            exit 0
          fi
          D=$(python -c "import json;print(json.load(open('data/ES/latest.json',encoding='utf-8'))['meta']['trade_date'])")
          git commit -m "曝險地圖更新 ES $D"
          for i in 1 2 3; do
            if git push origin HEAD:main; then echo "推送成功（第 $i 次）"; exit 0; fi
            echo "推送被拒，rebase 後重試（第 $i 次）"
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; echo "::error::rebase 失敗"; exit 1; }
            sleep 5
          done
          echo "::error::推送連續失敗三次"; exit 1
