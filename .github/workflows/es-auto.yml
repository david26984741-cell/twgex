name: ES 曝險地圖（自動，跑在紅線）

# ── 為什麼要拆成兩個 job ────────────────────────────────────────────────
# CME 的邊緣節點（Akamai）擋掉 GitHub 自家 runner 的 IP，所以「抓 CME」只能在
# 自己的機器上做。但那台機器**沒有裝 git**，提交推送做不了。
# 剛好兩邊的短處互補，所以：
#   job fetch （紅線）  ：只做一件它獨佔的事——跟 CME 講話，順便把圖算出來
#   job commit（GitHub）：把結果接過來提交推送
# 這樣紅線那台只跑必要的部分，其他都留在 GitHub 的機器上。
#
# ── 紅線那台的兩個限制（2026/09/01 實測，繞過去了，不用動那台任何設定）──
# 1. PowerShell 執行原則是 Restricted，workflow 裡任何 .ps1 一律被擋
#    （連 actions/setup-python 都不行，它內部要跑 setup.ps1）→ 全部用 cmd。
# 2. 沒有裝 Python → 用 Windows 內建的 curl.exe ＋ tar.exe 抓一份免安裝的
#    embeddable Python。本專案除了 cme_fetch.py 用到 playwright 之外全是標準
#    函式庫，所以夠用。不用安裝、不用管理員權限、不碰安全設定。
#
# 對外要走公司的 Proxy（proxy.capital.com.tw:8080），已經寫在 runner 的 .env，
# curl 與 Python 的 urllib 都會自己讀 https_proxy。
on:
  # ── 【2026/09/21 起排程整個停掉】────────────────────────────────────────
  # CME 把紅線那台的對外 IP 封了。Akamai 回的 403，本體原文是：
  #   "This IP address is blocked due to suspected web scraping activity
  #    associated with it on this CMEgroup.com page. Use of scripts, software,
  #    spiders, robots, avatars, agents, tools or other scraping mechanisms is
  #    strictly prohibited by CME Group's website Data Terms of Use."
  # 對方已經明確拒絕，而且點名這種用法違反他們網站的使用條款。
  #
  # **不要靠換 IP、換 User-Agent、換另一台機器繞過去。** 那是規避對方刻意設下的
  # 存取控制，不是技術問題。要繼續做 ES 的圖，正確的路是改用**有授權的**
  # CME 行情來源（群益本身是期貨商，公司的行情授權跟爬網頁是完全不同性質的東西）。
  #
  # 回頭看，2026/09/09~10 那個「回 HTTP 200 但 settlements 是空的」很可能就是
  # 同一套反爬的軟性階段，當時判斷成「限流」而加了補抓重試，方向是錯的——
  # 那些重試與手動補跑都是往同一個方向加壓，最後變成硬封。
  #
  # 排程先停，手動觸發保留著（換了來源之後才會用得到）。原本的兩班是：
  #   - cron: '15 7 * * 2-6'      # 台北 15:15（週二~週六）
  #   - cron: '0 13 * * 2-6'      # 台北 21:00（週二~週六）
  # 兩班都挑在紅線的外網開放時段（台北 14:00 ~ 隔天 06:00）內，那個限制仍然成立，
  # 之後若要恢復排程，時段條件不變。
  workflow_dispatch:
    inputs:
      date:
        description: '補某一天（YYYYMMDD）。留空＝自動抓最近一個已收盤的場次。'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # 【2026/09/21 從 gexmap-daily 拆出來】原本跟 daily.yml 共用一組，想法是
  # 「不要同時寫 data/」。但那個防護沒必要、代價又很實際：
  # 09/18 紅線的 runner 掉線之後，ES 的 job 在隊列裡躺了 24 小時，
  # **daily.yml 的 #72、#73 兩班排程被卡在後面，跟著一起被取消**——
  # 一台自架機器沒開機，把跑在 GitHub 上、根本不需要那台機器的那條線也拖垮了。
  # 兩支寫的是不同子目錄（data/ES/ vs data/TXO|SPX|SPY|QQQ/），
  # 提交那步又都是 push 失敗就 fetch + rebase 重試三次，同時跑不會打架。
  group: gexmap-es
  cancel-in-progress: false

env:
  PYVER: 3.12.7

jobs:
  fetch:
    name: 抓 CME 並建圖（紅線）
    runs-on: [self-hosted, cme]
    outputs:
      skip: ${{ steps.window.outputs.skip }}
    defaults:
      run:
        # /V:ON＝開延遲環境變數展開，重試迴圈裡的 !RC! 才會每一輪重新取值
        # （用 %RC% 的話整個 for 區塊在進入前就被展開成同一個值，迴圈等於失效）
        shell: cmd /V:ON /C call {0}
    steps:
      - uses: actions/checkout@v4

      - name: 弄一份可攜式 Python
        run: |
          echo === proxy：%https_proxy%
          if not exist pyemb.zip curl.exe -sSL --retry 2 -o pyemb.zip https://www.python.org/ftp/python/%PYVER%/python-%PYVER%-embed-amd64.zip
          if not exist pyemb.zip ( echo 下載 Python 失敗 & exit /b 1 )
          if exist pyemb rmdir /s /q pyemb
          mkdir pyemb
          tar -xf pyemb.zip -C pyemb
          rem embeddable 版的 sys.path 由 ._pth 寫死，要自己把專案目錄加進去，
          rem 不然 build.py 找不到 engine / symbols / cme 這些同目錄模組。
          echo %CD%>> pyemb\python312._pth
          pyemb\python.exe -c "import sys; print(sys.version); print(sys.path)"

      # 【2026/09/18~21 加的】cron 排在開放時段還不夠——**排隊中的 run 不受 cron 保護**。
      # runner 掉線期間 run 會一直排隊，runner 一回來就被領走，不管當下幾點。
      # 09/21 的 #41 就是排到週一早上 08:05 才被領走，整個在封網時段裡跑，
      # 抓不到 CME，最後 runner 直接跟伺服器失聯。理由與實際經過寫在 tools/netwindow.py。
      # 放在裝完 Python 之後，是因為要用 Python 從 UTC 換算台北時間——
      # 不依賴那台機器的時區設定，cmd 的 date/time 又跟地區設定綁在一起，不可靠。
      - name: 現在是不是紅線的封網時段
        id: window
        run: pyemb\python.exe -X utf8 tools\netwindow.py

      - name: 不變量自我測試
        if: steps.window.outputs.skip != 'true'
        run: pyemb\python.exe -X utf8 selftest.py

      # build.py 的訊息一律抄一份進 workflow 摘要。
      # 失敗時 Actions 的 log 介面常常展不開那一步（實測過），
      # 摘要則一定看得到，而且會留在 run 頁面上。
      #
      # ── 為什麼是「兩輪、隔 30 分鐘」，而不是「三輪、隔 2 分鐘」───────────
      # 【2026/09/09~10 的教訓：舊的重試方式是把自己鎖死的原因】
      # 那兩天兩次排程各跑三輪，六輪全敗，而且「沒有結算資料」的系列數是
      #     50 → 55 → 62 → 76 → 55 → 80（同一個 trade_day、同一份程式碼）
      # ——越重試越糟。CME 的邊緣節點限流時不回錯誤碼，回 HTTP 200 ＋ 空內容；
      # 每一輪整批重跑就是再打三百個請求上去，等於一直在餵那個限流。
      #
      # 現在分兩層處理，兩層都比舊的溫和：
      #   1. build.py 自己會補抓（cme.fetch_chain）：只補「昨天有、今天空手」
      #      的那幾個系列，隔 20 / 60 / 150 秒，一次十幾個請求而不是三百個。
      #      昨天有的幾乎全滅時（＝真的還沒發布）連補都不補。
      #   2. 這裡只留第二輪，中間隔 30 分鐘——短間隔對限流沒有意義。
      # 成功的一輪約 5 分鐘，最壞情況（兩輪都失敗）約 50 分鐘，timeout 兜得住。
      - name: 抓 CME 並建 ES 的圖（失敗的話隔 30 分鐘再一輪）
        if: steps.window.outputs.skip != 'true'
        timeout-minutes: 150
        env:
          # 走環境變數而不是把 ${{ }} 直接插進 cmd 腳本裡：插進去等於讓輸入變成
          # 可執行的指令，環境變數則只會被當成字串。
          BACKFILL_DATE: ${{ inputs.date }}
        run: |
          set PYTHONIOENCODING=utf-8
          set "DARG="
          if not "%BACKFILL_DATE%"=="" set "DARG=--date %BACKFILL_DATE%"
          if defined DARG echo === 補跑指定日期：%BACKFILL_DATE%
          set RC=1
          for %%N in (1 2) do (
            if !RC! NEQ 0 (
              echo ===== 第 %%N 輪 =====
              rem 【2026/09/08 試過用 curl 先探 CME 通不通，撤掉了】
              rem 探測一律回 HTTP 000（連線直接失敗），但同一時間 build.py 抓得好好的。
              rem 原因是 Akamai 看 User-Agent：curl 預設的 `curl/8.x` 會被直接重置連線，
              rem 而 cme.py 帶的是四段版本號的 Chrome UA（見 cme.py 的 UA 常數）。
              rem 也就是說那個探測是假警報，還把整條線擋死。要重做的話 UA 必須一致，
              rem 而且要先實測過再放進來——排程避開封網時段才是真正的解法。
              pyemb\python.exe -X utf8 build.py --symbol ES !DARG! > build_out.txt 2>&1
              set RC=!ERRORLEVEL!
              echo ### 第 %%N 輪 build.py 的輸出（離開碼 !RC!^) >> %GITHUB_STEP_SUMMARY%
              echo. >> %GITHUB_STEP_SUMMARY%
              echo ``` >> %GITHUB_STEP_SUMMARY%
              type build_out.txt >> %GITHUB_STEP_SUMMARY%
              echo ``` >> %GITHUB_STEP_SUMMARY%
              type build_out.txt
              rem 只有「後面還有一輪」才等。少了 "%%N"=="1" 這個條件的話，
              rem 最後一輪失敗後還會再空等 30 分鐘才收工——2026/09/21 實測，
              rem 兩輪都秒 403，整步卻跑了 62 分鐘，其中 60 分鐘是在空等。
              if !RC! NEQ 0 if "%%N"=="1" (
                rem 30 分鐘。用 ping 不用 timeout：timeout 在被重導向的環境下會
                rem 直接吐「Input redirection is not supported」然後失敗。
                echo 這一輪沒過，等 30 分鐘讓限流退掉再試。
                ping -n 1801 127.0.0.1 > nul
              )
            )
          )
          exit /b !RC!

      - name: 把結果交出去
        if: steps.window.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: es-data
          path: data/ES/
          retention-days: 3
          if-no-files-found: error

  commit:
    name: 提交（GitHub 的機器）
    needs: fetch
    if: needs.fetch.outputs.skip != 'true'      # 封網時段跳過時沒有東西可提交
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 推送被拒時要能 rebase

      - uses: actions/download-artifact@v4
        with:
          name: es-data
          path: data/ES/

      - name: 檢查接到的東西
        run: |
          python - <<'PY'
          import json
          m = json.load(open("data/ES/latest.json", encoding="utf-8"))["meta"]
          print(f"trade_date={m['trade_date']}  未平倉={m.get('oi_total'):,}  "
                f"標的價={m.get('s_ref')}  來源={m.get('source')}")
          assert m.get("oi_total", 0) > 0, "未平倉是 0，不提交"
          PY

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 一定要先 add 再比對：git diff 看不到「未追蹤」的新檔。
          git add -A data/ES/
          if git diff --cached --quiet -- data/ES/; then
            echo "ES 資料沒有變動（可能是重複跑同一天），跳過提交。"
            exit 0
          fi
          D=$(python -c "import json;print(json.load(open('data/ES/latest.json',encoding='utf-8'))['meta']['trade_date'])")
          git commit -m "曝險地圖更新 ES $D"
          for i in 1 2 3; do
            if git push origin HEAD:main; then echo "推送成功（第 $i 次）"; exit 0; fi
            echo "推送被拒，rebase 後重試（第 $i 次）"
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; echo "::error::rebase 失敗"; exit 1; }
            sleep 5
          done
          echo "::error::推送連續失敗三次"; exit 1
