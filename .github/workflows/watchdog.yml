name: 資料有沒有跟上（看門狗）

# ── 這支只讀資料與 Actions API，不抓任何行情 ──────────────────────────
# runs-on 是 ubuntu-latest（GitHub 的機器），只讀兩樣東西——checkout 下來的
# data/*/latest.json，以及本 repo 的 Actions API。不連任何外部行情來源、
# 不需要瀏覽器。所以排在台北早上 08:00 是安全的，那個時間點反而最好：
#   ・台指前一天 15:15 那班、美股前一天 12:30 那班都早就跑完了
#   ・出事的話你上班第一件事就會看到信，不用等到自己想起來去看網站
on:
  schedule:
    - cron: '0 0 * * 1-5'        # ＝ 台北 08:00（週一~週五）
    # 晚班（2026/09/25 加）：21:30 時兩班美股（12:30、15:15，含常見的五小時延遲）都跑完了，
    # 美股該有的落後是定值 1，漏一天就是 2 會叫——比隔天早上那班早十個半小時知道。
    # 台指在 21:30 該有的落後是 0，漏一天只到 1 不會叫，仍靠早上那班（門檻不改）。
    - cron: '30 13 * * 1-5'      # ＝ 台北 21:30（週一~週五）
  workflow_dispatch:

permissions:
  contents: read
  actions: read                  # 要讀 Actions API 問最近的執行結果

# 故意不跟 gexmap-daily 共用 concurrency 群組：這支只讀不寫，
# 沒必要排在更新那兩支後面等，卡住反而會延後通知。

jobs:
  check:
    name: 對日期與最近的執行結果
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 失敗時 GitHub 預設會寄信給 repo 擁有者，所以這裡不用另外接通知。
      # 判斷邏輯與「為什麼需要兩個訊號」寫在 tools/watchdog.py 的檔頭。
      - name: 檢查
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/watchdog.py
