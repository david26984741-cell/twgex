name: 紅線探測（一次性，測完可刪）

# 在自己的機器（self-hosted runner，標籤 cme）上跑，回答一個問題：
# 純 Python 打不打得到 CME？打得通的話，整條 ES 可以不用瀏覽器。
#
# **這台的 PowerShell 執行原則是 Restricted**（2026/09/01 實測：workflow 裡的 .ps1
# 一律回「running scripts is disabled on this system」）。所以這裡一律用 cmd，
# 而且 cmd 只負責呼叫 Python，報告內容全部由 Python 產生——
# 在批次檔裡組 Markdown 表格要跳脫一堆符號，不值得。
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: cmd

jobs:
  probe:
    runs-on: [self-hosted, cme]
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      # 2026/09/01 實測：這台**沒有** Python（where python / where py 都找不到）。
      # 用 setup-python 讓 Actions 自己裝進 runner 的工具快取，使用者完全不用動手。
      # 它走 @actions/http-client，會讀 https_proxy 環境變數（runner 的 .env 已設）。
      - name: 裝 Python
        id: setup
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 有沒有 Python
        continue-on-error: true
        run: |
          where python
          where py
          where git
          python --version

      - name: 純 Python 打 CME
        continue-on-error: true
        run: |
          python tools\cme_probe.py >> %GITHUB_STEP_SUMMARY% 2>&1 || py tools\cme_probe.py >> %GITHUB_STEP_SUMMARY% 2>&1
