name: 每日更新曝險地圖

on:
  schedule:
    # 台北 15:15（UTC+8）：台指。一般交易時段 13:45 收盤，期交所盤後檔通常 15:00 前後上架。
    # 只有這一班、沒有保險班——期交所當天若延遲上架，就自己按 Run workflow 補跑。
    - cron: '15 7 * * 1-5'
    # 註：ES（CME）不在這裡。CME 的邊緣節點擋掉 GitHub Actions 的 IP（純 Python 403、
    #     無頭 Chromium 走 HTTP/1.1 逾時），抓資料那一步只能在自己的機器上用瀏覽器做。
    #     流程改成：開 tools/cme.html 抓成 raw/cme_ES.json 上傳 → es.yml 接手建圖。
    # 台北 23:00 ＝ 美東夏令 11:00 / 冬令 10:00，抓前一個交易日的收盤。
    #
    # 為什麼是「開盤後」而不是「開盤前」——這一點跟直覺相反，踩過兩次才弄清楚：
    # CBOE 這份檔案裡，價格是即時的，未平倉量卻要等 OCC 隔天早上才更新（實測美東 10:00~10:30）。
    # 也就是說，開盤前抓 → 價格對（前一日收盤）但未平倉舊一天；
    # 等未平倉更新 → 未平倉對了但價格已經變成當日盤中。**沒有任何一個時點兩者同時正確。**
    # 解法是價格改取每一檔的 prev_day_close（前一交易日收盤價），
    # 於是只要「未平倉已更新」這一個條件成立就行，而那個窗口一路開到當天收盤，
    # 有好幾個小時，完全不怕 GitHub 排程延遲。
    # 底下的「等未平倉更新」那一步會確認條件成立才開始建圖，沒等到就整天不產出。
    - cron: '0 15 * * 1-5'
  workflow_dispatch:
    inputs:
      symbols:
        description: '要更新的標的（空白 = 全部）'
        required: false
        default: ''
      oi_source:
        description: '美股未平倉來源（occ ＝ 直接向 OCC 拿，比 CBOE 早十幾個小時）'
        required: false
        default: 'cboe'
        type: choice
        options: ['cboe', 'occ']

permissions:
  contents: write

concurrency:
  group: gexmap-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 推送被拒時要能 rebase

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 不變量自我測試（數學層）
        run: python selftest.py

      - name: 決定要跑哪些標的
        id: pick
        run: |
          # 不要用 github.event.schedule 的字串去比對——2026-08-27 那一輪（#18）證明它會失效：
          # cron 明明是 '0 15 * * 1-5'，卻掉進 TXO 那個分支，美股整晚沒更新。
          # 改成看實際的 UTC 時刻，早班／晚班一翻兩瞪眼。
          H=$(date -u +%-H)
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            SYMS="${{ github.event.inputs.symbols }}"
          elif [ "${{ github.event_name }}" != "schedule" ]; then
            SYMS="TXO SPX SPY QQQ"
          elif [ "$H" -ge 12 ]; then
            SYMS="TXO SPX SPY QQQ"    # 晚班：美股為主，順便補台指（同一天已建好就不會重寫）
          else
            SYMS="TXO"
          fi
          # 未平倉來源。OCC 在交易日當天傍晚（美東約 20:00）就發布逐序列未平倉，
          # CBOE 這份 delayed_quotes 檔要隔天早上（美東 10:00~10:30）才吃進去。
          # 目前預設仍走 CBOE；手動 dispatch 時可以選 occ 做平行驗證。
          SRC="${{ github.event.inputs.oi_source }}"
          [ -n "$SRC" ] || SRC=cboe
          echo "事件=${{ github.event_name }}  排程字串='${{ github.event.schedule }}'  UTC 時=$H  選到=$SYMS  未平倉來源=$SRC"
          echo "syms=$SYMS" >> "$GITHUB_OUTPUT"
          echo "oi_source=$SRC" >> "$GITHUB_OUTPUT"
          echo "要更新：$SYMS（未平倉來源 $SRC）"

      # 走 OCC 就不需要等 CBOE——那正是換來源的重點：OCC 早就發布了。
      - name: 等 CBOE 的未平倉量更新到前一個交易日
        if: steps.pick.outputs.oi_source != 'occ' && (contains(steps.pick.outputs.syms, 'SPX') || contains(steps.pick.outputs.syms, 'SPY') || contains(steps.pick.outputs.syms, 'QQQ'))
        run: python wait_oi.py --minutes 150 --every 5

      - name: 產生資料
        run: |
          fail=0
          # 未平倉來源只對美股三檔有意義：台指走期交所，ES 走 CME，兩邊都不經過 OCC。
          OIARG=""
          # 注意：這裡不能寫成 `[ ... ] && OIARG=...`——Actions 的 shell 帶 -e，
          # 條件不成立時整串回傳 1，整個步驟會當場失敗。
          if [ "${{ steps.pick.outputs.oi_source }}" = "occ" ]; then OIARG="--oi-source occ"; fi
          for s in ${{ steps.pick.outputs.syms }}; do
            echo "::group::$s"
            A=""
            case "$s" in SPX|SPY|QQQ) A="$OIARG";; esac
            if [ "$s" = "ES" ]; then
              echo "::warning::ES 不從這裡抓（CME 擋 Actions 的 IP），請用 tools/cme.html"
            elif python build.py --symbol "$s" $A; then :; else
              echo "::warning::$s 更新失敗（來源可能暫時不可用）"; fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" = "1" ] && [ -z "$(git status --porcelain -- data/)" ]; then
            echo "::error::全部標的都失敗且沒有任何資料變動"; exit 1
          fi

      # 平行觀察期：OCC 的逐履約價未平倉在交易日當天傍晚就有，CBOE 要隔天早上。
      # 這一步只讀不寫、也不會讓工作失敗，純粹每天記一份逐檔對照，
      # 確認兩邊數字一致之後再考慮換來源、把排程往前挪十幾個小時。
      - name: 對照 OCC 與 CBOE 的未平倉（觀察用，不影響產出）
        if: always() && (contains(steps.pick.outputs.syms, 'SPX') || contains(steps.pick.outputs.syms, 'SPY') || contains(steps.pick.outputs.syms, 'QQQ'))
        continue-on-error: true
        run: |
          python occ_check.py --symbols SPX SPY QQQ >> "$GITHUB_STEP_SUMMARY" 2>&1 || \
            echo "（對照步驟自己出錯了，不影響上面的產出）" >> "$GITHUB_STEP_SUMMARY"

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 一定要先 add 再比對：git diff 看不到「未追蹤」的新檔，
          # 第一次建立 data/<新標的>/ 時會誤判成沒有變動而跳過提交。
          git add -A data/
          if git diff --cached --quiet -- data/; then
            echo "資料沒有變動（假日或來源尚未更新），跳過提交。"
            exit 0
          fi
          # 提交訊息帶上各標的實際的資料日期，從 commit 清單一眼就看得出這次有沒有抓到新的一天
          DATES=$(python -c "import json,os;print(' / '.join(s+' '+json.load(open(os.path.join('data',s,'latest.json'),encoding='utf-8'))['meta']['trade_date'] for s in ('TXO','SPX','ES','SPY','QQQ') if os.path.exists(os.path.join('data',s,'latest.json'))))")
          git commit -m "曝險地圖更新 ${DATES:-$(date -u +%Y-%m-%d)}"
          # main 有可能在這次跑的期間被人推過（例如從網頁改了 app.js），
          # 直接 push 會被拒。失敗就 rebase 後重試，最多三次。
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "推送成功（第 $i 次嘗試）"; exit 0
            fi
            echo "推送被拒，先取回遠端再 rebase（第 $i 次）"
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; echo "::error::rebase 失敗，請手動處理"; exit 1; }
            sleep 5
          done
          echo "::error::推送連續失敗三次"; exit 1
