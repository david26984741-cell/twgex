name: 每日更新曝險地圖

on:
  schedule:
    # 台北 15:15（UTC+8）：台指。一般交易時段 13:45 收盤，期交所盤後檔通常 15:00 前後上架。
    # 只有這一班、沒有保險班——期交所當天若延遲上架，就自己按 Run workflow 補跑。
    - cron: '15 7 * * 1-5'
    # 註：ES（CME）不在排程裡。CME 的邊緣節點擋掉 GitHub Actions 的 IP：
    #     純 Python 請求回 403、無頭 Chromium 走 HTTP/2 被重置、走 HTTP/1.1 則 90 秒逾時。
    #     cme.py / cme_fetch.py 都留著且測試通過，在一般網路環境下可以跑：
    #       python cme_fetch.py --out raw/cme_ES.json && python build.py --symbol ES --json raw/cme_ES.json
    # 美東 09:20（開盤前）：抓前一個交易日。此時 OCC 已把未平倉量更新完，
    # CBOE 的報價也還停在前一個收盤，兩邊指的是同一天。週一到週五各跑一次，抓的都是前一個交易日（OCC 每個營業日早上才發布前一日的未平倉量，
    # 所以週六跑會拿到過期的 OI；程式會從資料本身推斷 OI 是哪一天的並據此標示）。
    - cron: '20 13 * * 1-5'
  workflow_dispatch:
    inputs:
      symbols:
        description: '要更新的標的（空白 = 全部）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: gexmap-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 推送被拒時要能 rebase

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 不變量自我測試（數學層）
        run: python selftest.py

      - name: 決定要跑哪些標的
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            SYMS="${{ github.event.inputs.symbols }}"
          elif [ "${{ github.event.schedule }}" = "20 13 * * 1-5" ]; then
            SYMS="SPX SPY QQQ"
          elif [ -n "${{ github.event.schedule }}" ]; then
            SYMS="TXO"
          else
            SYMS="TXO SPX SPY QQQ"
          fi
          echo "syms=$SYMS" >> "$GITHUB_OUTPUT"
          echo "要更新：$SYMS"

      - name: 安裝無頭瀏覽器（只有要跑 ES 時）
        if: contains(steps.pick.outputs.syms, 'ES')
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 產生資料
        run: |
          fail=0
          for s in ${{ steps.pick.outputs.syms }}; do
            echo "::group::$s"
            if [ "$s" = "ES" ]; then
              # CME 擋非瀏覽器請求，先用無頭 Chromium 把結算表抓成檔案再餵給 build
              if python cme_fetch.py --out raw/cme_ES.json \
                 && python build.py --symbol ES --json raw/cme_ES.json; then :; else
                echo "::warning::ES 更新失敗（CME 來源可能暫時不可用）"; fail=1
              fi
            elif python build.py --symbol "$s"; then :; else
              echo "::warning::$s 更新失敗（來源可能暫時不可用）"; fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" = "1" ] && git diff --quiet -- data/; then
            echo "::error::全部標的都失敗且沒有任何資料變動"; exit 1
          fi

      - name: 提交
        run: |
          if git diff --quiet -- data/; then
            echo "資料沒有變動（假日或來源尚未更新），跳過提交。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # 提交訊息帶上各標的實際的資料日期，從 commit 清單一眼就看得出這次有沒有抓到新的一天
          DATES=$(python -c "import json,os;print(' / '.join(s+' '+json.load(open(os.path.join('data',s,'latest.json'),encoding='utf-8'))['meta']['trade_date'] for s in ('TXO','SPX','ES','SPY','QQQ') if os.path.exists(os.path.join('data',s,'latest.json'))))")
          git commit -m "曝險地圖更新 ${DATES:-$(date -u +%Y-%m-%d)}"
          # main 有可能在這次跑的期間被人推過（例如從網頁改了 app.js），
          # 直接 push 會被拒。失敗就 rebase 後重試，最多三次。
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "推送成功（第 $i 次嘗試）"; exit 0
            fi
            echo "推送被拒，先取回遠端再 rebase（第 $i 次）"
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; echo "::error::rebase 失敗，請手動處理"; exit 1; }
            sleep 5
          done
          echo "::error::推送連續失敗三次"; exit 1
