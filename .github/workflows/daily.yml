name: 每日更新曝險地圖

on:
  schedule:
    # 台北 15:40 / 17:40（UTC+8）：台指。第二次是保險，期交所偶爾延遲公布。
    - cron: '40 7 * * 1-5'
    - cron: '40 9 * * 1-5'
    # 美東 09:20（開盤前）：抓前一個交易日。此時 OCC 已把未平倉量更新完，
    # CBOE 的報價也還停在前一個收盤，兩邊指的是同一天。週一到週五各跑一次，抓的都是前一個交易日（OCC 每個營業日早上才發布前一日的未平倉量，
    # 所以週六跑會拿到過期的 OI；程式會從資料本身推斷 OI 是哪一天的並據此標示）。
    - cron: '20 13 * * 1-5'
  workflow_dispatch:
    inputs:
      symbols:
        description: '要更新的標的（空白 = 全部）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: gexmap-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 推送被拒時要能 rebase

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 不變量自我測試（數學層）
        run: python selftest.py

      - name: 決定要跑哪些標的
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            SYMS="${{ github.event.inputs.symbols }}"
          elif [ "${{ github.event.schedule }}" = "20 13 * * 1-5" ]; then
            SYMS="SPY QQQ"
          elif [ -n "${{ github.event.schedule }}" ]; then
            SYMS="TXO"
          else
            SYMS="TXO SPY QQQ"
          fi
          echo "syms=$SYMS" >> "$GITHUB_OUTPUT"
          echo "要更新：$SYMS"

      - name: 產生資料
        run: |
          fail=0
          for s in ${{ steps.pick.outputs.syms }}; do
            echo "::group::$s"
            if python build.py --symbol "$s"; then :; else
              echo "::warning::$s 更新失敗（來源可能暫時不可用）"; fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" = "1" ] && git diff --quiet -- data/; then
            echo "::error::全部標的都失敗且沒有任何資料變動"; exit 1
          fi

      - name: 提交
        run: |
          if git diff --quiet -- data/; then
            echo "資料沒有變動（假日或來源尚未更新），跳過提交。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "曝險地圖更新 $(date -u +%Y-%m-%d)"
          # main 有可能在這次跑的期間被人推過（例如從網頁改了 app.js），
          # 直接 push 會被拒。失敗就 rebase 後重試，最多三次。
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "推送成功（第 $i 次嘗試）"; exit 0
            fi
            echo "推送被拒，先取回遠端再 rebase（第 $i 次）"
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; echo "::error::rebase 失敗，請手動處理"; exit 1; }
            sleep 5
          done
          echo "::error::推送連續失敗三次"; exit 1
