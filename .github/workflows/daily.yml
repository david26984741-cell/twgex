name: 每日更新曝險地圖

on:
  schedule:
    # ── 台北 09:00（週二~週六）：SPX / SPY / QQQ ────────────────────────────
    # 抓的是**前一個**美股收盤。台北 09:00 ＝ 美東前一天 21:00（夏令）／20:00（冬令）。
    # 為什麼這個時點可以：未平倉改向 OCC 拿之後，OCC 在交易日**當天傍晚**（美東約 20:00）
    # 就發布逐序列未平倉，不必再等 CBOE 隔天早上才吃進去；而 CBOE 每一檔的 prev_day_close
    # 在美東當天收盤那一刻就滾成同一個交易日。兩邊天然同日。
    # 對齊窗口一路開到隔天台北 04:00（美東收盤），所以 GitHub 排程延遲三小時也無所謂。
    # 冬令時 OCC 大約在台北 09:00 整點才發布，可能剛好還沒到——底下的重試會等，
    # 真的等不到就整天不產出（build.py 會擋下「新價格＋舊未平倉」的拼裝圖），
    # 下午 15:15 那班會再補一次。
    - cron: '0 1 * * 2-6'
    # ── 台北 15:15（週一~週五）：台指 TXO ──────────────────────────────────
    # 一般交易時段 13:45 收盤，期交所盤後檔約 15:00 上架，留 15 分鐘。
    - cron: '15 7 * * 1-5'
    # 註：ES（CME）不在這裡。CME 的邊緣節點擋掉 GitHub Actions 的 IP（純 Python 403、
    #     無頭 Chromium 走 HTTP/1.1 逾時），抓資料那一步只能從一般網路的機器打。
    #     要把 ES 收進這個 workflow，得在自己那台裝 self-hosted runner。
  workflow_dispatch:
    inputs:
      symbols:
        # 2026/08/30 踩過：以為留空只會跑台指，結果跑了全部四檔，
        # 撞上「等 CBOE 未平倉」那一步，週六空轉了 17 分鐘才被取消。
        description: '要更新的標的。留空 = 全部四檔（TXO SPX SPY QQQ）；只要台指請填 TXO'
        required: false
        default: ''
      oi_source:
        description: '美股未平倉來源。預設 occ（直接向 OCC 拿，比 CBOE 早十幾個小時）；cboe 是舊路徑，留著備援'
        required: false
        default: 'occ'
        type: choice
        options: ['occ', 'cboe']

permissions:
  contents: write

concurrency:
  group: gexmap-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 推送被拒時要能 rebase

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 不變量自我測試（數學層）
        run: python selftest.py

      - name: 決定要跑哪些標的
        id: pick
        run: |
          # **排程一律跑全部四檔，不再依「哪一班」分流。**
          # 2026/08/27 那輪（#18）就是栽在分流：cron 明明是美股那班，卻掉進台指分支，
          # 美股整晚沒更新。改用 UTC 時刻判斷也只是把猜測換一種寫法。
          # 現在乾脆不猜——兩班都跑全部，讓各自的新舊判斷去決定要不要寫：
          #   build.py 抓到比現有舊的日期只寫歷史檔、不動 latest.json；
          #   提交那步沒有變動就跳過。
          # 所以「多跑一次」永遠是安全的，而且下午那班天然變成早上那班的補跑。
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            SYMS="${{ github.event.inputs.symbols }}"
          else
            SYMS="TXO SPX SPY QQQ"
          fi
          # 未平倉來源預設 OCC。排程觸發時 inputs 是空的，所以這裡要自己補預設值。
          SRC="${{ github.event.inputs.oi_source }}"
          [ -n "$SRC" ] || SRC=occ
          echo "事件=${{ github.event_name }}  排程字串='${{ github.event.schedule }}'  UTC 時=$(date -u +%-H)  選到=$SYMS  未平倉來源=$SRC"
          echo "syms=$SYMS" >> "$GITHUB_OUTPUT"
          echo "oi_source=$SRC" >> "$GITHUB_OUTPUT"
          echo "要更新：$SYMS（未平倉來源 $SRC）"

      # 走 OCC 就不需要等 CBOE——那正是換來源的重點：OCC 早就發布了。
      - name: 等 CBOE 的未平倉量更新到前一個交易日
        if: steps.pick.outputs.oi_source != 'occ' && (contains(steps.pick.outputs.syms, 'SPX') || contains(steps.pick.outputs.syms, 'SPY') || contains(steps.pick.outputs.syms, 'QQQ'))
        run: python wait_oi.py --minutes 150 --every 5

      - name: 產生資料
        run: |
          fail=0
          OIARG=""
          # 注意：這裡不能寫成 `[ ... ] && OIARG=...`——Actions 的 shell 帶 -e，
          # 條件不成立時整串回傳 1，整個步驟會當場失敗。
          if [ "${{ steps.pick.outputs.oi_source }}" = "occ" ]; then OIARG="--oi-source occ"; fi
          for s in ${{ steps.pick.outputs.syms }}; do
            echo "::group::$s"
            if [ "$s" = "ES" ]; then
              echo "::warning::ES 不從這裡抓（CME 擋 Actions 的 IP），請用 tools/cme.html"
              echo "::endgroup::"
              continue
            fi
            A=""
            case "$s" in SPX|SPY|QQQ) A="$OIARG";; esac
            # **來源晚上架就等一下再試。** 兩邊都會遲到：
            #   期交所盤後檔約 15:00 上架（我們 15:15 跑，偶爾還沒好）；
            #   OCC 夏令台北 08:00 發布、冬令 09:00（我們 09:00 跑，冬令會卡在整點）。
            # build.py 遇到「未平倉與價格不同日」會直接不產出（不會畫拼裝圖），
            # 所以這裡重試是安全的：三次、每次隔 5 分鐘。
            ok=0
            for attempt in 1 2 3; do
              if python build.py --symbol "$s" $A; then ok=1; break; fi
              if [ "$attempt" != "3" ]; then
                echo "第 $attempt 次沒成功，等 5 分鐘再試（來源可能還沒上架）"
                sleep 300
              fi
            done
            if [ "$ok" != "1" ]; then
              echo "::warning::$s 更新失敗（來源可能還沒上架，下一班會再補）"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" = "1" ] && [ -z "$(git status --porcelain -- data/)" ]; then
            echo "::error::全部標的都失敗且沒有任何資料變動"; exit 1
          fi

      # 平行觀察期：OCC 的逐履約價未平倉在交易日當天傍晚就有，CBOE 要隔天早上。
      # 這一步只讀不寫、也不會讓工作失敗，純粹每天記一份逐檔對照，
      # 確認兩邊數字一致之後再考慮換來源、把排程往前挪十幾個小時。
      - name: 對照 OCC 與 CBOE 的未平倉（觀察用，不影響產出）
        if: always() && (contains(steps.pick.outputs.syms, 'SPX') || contains(steps.pick.outputs.syms, 'SPY') || contains(steps.pick.outputs.syms, 'QQQ'))
        continue-on-error: true
        run: |
          python occ_check.py --symbols SPX SPY QQQ >> "$GITHUB_STEP_SUMMARY" 2>&1 || \
            echo "（對照步驟自己出錯了，不影響上面的產出）" >> "$GITHUB_STEP_SUMMARY"

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 一定要先 add 再比對：git diff 看不到「未追蹤」的新檔，
          # 第一次建立 data/<新標的>/ 時會誤判成沒有變動而跳過提交。
          git add -A data/
          if git diff --cached --quiet -- data/; then
            echo "資料沒有變動（假日或來源尚未更新），跳過提交。"
            exit 0
          fi
          # 提交訊息帶上各標的實際的資料日期，從 commit 清單一眼就看得出這次有沒有抓到新的一天
          DATES=$(python -c "import json,os;print(' / '.join(s+' '+json.load(open(os.path.join('data',s,'latest.json'),encoding='utf-8'))['meta']['trade_date'] for s in ('TXO','SPX','ES','SPY','QQQ') if os.path.exists(os.path.join('data',s,'latest.json'))))")
          git commit -m "曝險地圖更新 ${DATES:-$(date -u +%Y-%m-%d)}"
          # main 有可能在這次跑的期間被人推過（例如從網頁改了 app.js），
          # 直接 push 會被拒。失敗就 rebase 後重試，最多三次。
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "推送成功（第 $i 次嘗試）"; exit 0
            fi
            echo "推送被拒，先取回遠端再 rebase（第 $i 次）"
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; echo "::error::rebase 失敗，請手動處理"; exit 1; }
            sleep 5
          done
          echo "::error::推送連續失敗三次"; exit 1
